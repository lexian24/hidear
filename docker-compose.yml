services:
  # Redis - Message broker for Celery
  redis:
    image: redis:7-alpine
    container_name: meraudio-redis
    ports:
      - "${REDIS_PORT:-7293}:6379"  # External: 7293, Internal: 6379
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - meraudio-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meraudio-backend
    volumes:
      - ./backend:/app
      - ./backend/audio_files:/app/audio_files
      - ./backend/speaker_profiles:/app/speaker_profiles
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./meraudio.db}
      - HF_TOKEN=${HF_TOKEN}
      - HF_HOME=/app/models
      - TRANSFORMERS_CACHE=/app/models
      - PORT=${BACKEND_INTERNAL_PORT:-8000}
      - MERALION_ENDPOINT_URL=${MERALION_ENDPOINT_URL}
      - QWEN_SAGEMAKER_ENDPOINT=${QWEN_SAGEMAKER_ENDPOINT}
      - QWENVL_AWS_ACCESS_KEY_ID=${QWENVL_AWS_ACCESS_KEY_ID}
      - QWENVL_AWS_SECRET_ACCESS_KEY=${QWENVL_AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-southeast-1}
    ports:
      - "${BACKEND_PORT:-9427}:${BACKEND_INTERNAL_PORT:-8000}"  # External: 9427, Internal: 8000
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - meraudio-network

  # Celery Worker - Diarization + Speaker ID
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: meraudio-celery
    volumes:
      - ./backend:/app
      - ./backend/audio_files:/app/audio_files
      - ./backend/speaker_profiles:/app/speaker_profiles
      - celery_models:/app/models
    environment:
      - REDIS_URL=redis://redis:6379/0
      - HF_TOKEN=${HF_TOKEN}
      - HF_HOME=/app/models
      - TRANSFORMERS_CACHE=/app/models
      - MERALION_ENDPOINT_URL=${MERALION_ENDPOINT_URL}
      - QWEN_SAGEMAKER_ENDPOINT=${QWEN_SAGEMAKER_ENDPOINT}
      - QWENVL_AWS_ACCESS_KEY_ID=${QWENVL_AWS_ACCESS_KEY_ID}
      - QWENVL_AWS_SECRET_ACCESS_KEY=${QWENVL_AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-southeast-1}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - meraudio-network

  # Optional: Redis Commander (GUI for Redis)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: meraudio-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "${REDIS_COMMANDER_PORT:-9429}:8081"  # External: 9429, Internal: 8081
    depends_on:
      - redis
    networks:
      - meraudio-network
    profiles:
      - tools  # Only start with: docker-compose --profile tools up

  # Optional: Frontend (if exists)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: meraudio-frontend
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend
  #   restart: unless-stopped
  #   networks:
  #     - meraudio-network

volumes:
  redis_data:
    driver: local
  celery_models:
    driver: local

networks:
  meraudio-network:
    driver: bridge
